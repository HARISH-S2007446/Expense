
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      containers:
        - name: expense-tracker
          image: expense-tracker:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATA_DIR
              value: /app/data
          volumeMounts:
            - name: expense-data
              mountPath: /app/data
      volumes:
        - name: expense-data
          persistentVolumeClaim:
            claimName: expense-v1-data
---
apiVersion: v1
kind: Service
metadata:
  name: expense-tracker-service
spec:
  type: NodePort
  selector:
    app: expense-tracker
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080